name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found project ZIP: $ZIP_FILE"

            mkdir -p android-project
            unzip -o "$ZIP_FILE" -d android-project

            echo "Extracted project:"
            find android-project -maxdepth 3 -type f | head -100
          else
            echo "No ZIP file found."
          fi

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          elif [ -f "android-project/settings.gradle" ] || [ -f "android-project/settings.gradle.kts" ]; then
            PROJECT_DIR="android-project"
          else
            FOUND=$(find android-project . -type f \
              -name "settings.gradle" -o \
              -name "settings.gradle.kts" \
            -print -quit 2>/dev/null || true)

            if [ -n "$FOUND" ]; then
              PROJECT_DIR=$(dirname "$FOUND")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            echo "Searching repository:"
            find . -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            GRADLE_FILE="$PROJECT_DIR/app/build.gradle"
          elif [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"
          else
            GRADLE_FILE="$PROJECT_DIR/build.gradle"
          fi

          echo "Checking Android project:"
          echo "$GRADLE_FILE"

          SDK_PACKAGES="platform-tools"

          if grep -q "compileSdk" "$GRADLE_FILE"; then
            COMPILE_SDK=$(grep -oE 'compileSdk(VERSION)?[[:space:]]*[=
