name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP=$(find . -name "PersonalVoiceAssistant_Android_MVP.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: PersonalVoiceAssistant_Android_MVP.zip was not found."
            exit 1
          fi

          mkdir -p android-project
          unzip -q "$ZIP" -d android-project

          PROJECT_DIR=$(find android-project -name "settings.gradle.kts" -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalVoiceAssistant-APK
          path: "**/build/outputs/apk/debug/*.apk"
